name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Teste visual (Chromium headless, SwiftShader)
        run: |
          npm i --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
          node tools/visual-test.mjs --out ci-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ci-screenshots
