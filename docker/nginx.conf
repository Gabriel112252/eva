server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Um bloco `types` no contexto server substitui a tabela herdada, então listamos
    # explicitamente tudo o que o jogo serve (inclui WASM do Havok e GLB dos personagens).
    types {
        text/html                       html htm;
        text/css                        css;
        text/javascript                 js mjs;
        application/json                json map webmanifest;
        application/wasm                wasm;
        model/gltf-binary               glb;
        model/gltf+json                 gltf;
        image/png                       png;
        image/jpeg                      jpg jpeg;
        image/webp                      webp;
        image/svg+xml                   svg;
        image/x-icon                    ico;
        image/ktx2                      ktx2;
        font/woff2                      woff2;
        font/woff                       woff;
        font/ttf                        ttf;
        audio/ogg                       ogg;
        audio/mpeg                      mp3;
        audio/wav                       wav;
        video/mp4                       mp4;
        video/webm                      webm;
        text/plain                      txt md;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/wasm model/gltf-binary image/svg+xml;
    gzip_min_length 1024;

    # Personagens/modelos regenerados sem hash: cache curto com revalidação
    location ~* ^/assets/characters/ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        try_files $uri =404;
    }

    # Bundles com hash no nome (Vite): cache longo
    location ~* ^/assets/.+\.(js|mjs|css|wasm|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Demais modelos e áudio estáticos
    location ~* \.(glb|gltf|ogg|mp3|wav|ktx2)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
